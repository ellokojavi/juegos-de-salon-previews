<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Blackjack">
  <!-- Blackjack icon: fanned King of Spades (K♠) and Ace of Spades (A♠) -->
  <defs>
    <filter id="bj-sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <!-- Crisp vector spade pip centered at (0, 0) -->
    <path id="spade" d="M0-9 C3.2-5 7.5-1.5 7.5 2.4 C7.5 5 5.4 6.6 3.3 6.6 C2 6.6 1 5.9 0.5 5 L2.2 9 H-2.2 L-0.5 5 C-1 5.9 -2 6.6 -3.3 6.6 C-5.4 6.6 -7.5 5 -7.5 2.4 C-7.5-1.5 -3.2-5 0-9 Z"/>
  </defs>

  <!-- Left card: King of Spades -->
  <g transform="translate(34 50) rotate(-12)" filter="url(#bj-sh)">
    <rect x="-22" y="-33" width="44" height="66" rx="6" fill="#fffdf7" stroke="#ffd23f" stroke-width="2"/>
    <text x="-17" y="-17" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="14" fill="#1a1a1a">K</text>
    <use href="#spade" transform="translate(-12 -10) scale(0.45)" fill="#1a1a1a"/>
    <!-- Center bold K + spade -->
    <text x="-3" y="6" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="22" text-anchor="middle" fill="#1a1a1a">K</text>
    <use href="#spade" transform="translate(-3 18) scale(0.85)" fill="#1a1a1a"/>
    <text x="17" y="27" transform="rotate(180 17 27)" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="14" fill="#1a1a1a">K</text>
  </g>

  <!-- Right card: Ace of Spades -->
  <g transform="translate(61 48) rotate(10)" filter="url(#bj-sh)">
    <rect x="-22" y="-33" width="44" height="66" rx="6" fill="#fffdf7" stroke="#ffd23f" stroke-width="2"/>
    <text x="-17" y="-17" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="14" fill="#1a1a1a">A</text>
    <use href="#spade" transform="translate(-12 -10) scale(0.45)" fill="#1a1a1a"/>
    <use href="#spade" transform="translate(0 3) scale(1.7)" fill="#1a1a1a"/>
    <text x="17" y="27" transform="rotate(180 17 27)" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="14" fill="#1a1a1a">A</text>
  </g>
</svg>
