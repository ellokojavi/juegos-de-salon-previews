    .rk-macro button.on { background: var(--yellow); color: #3a1200; }
    .rk-seccion { display: grid; gap: 14px; }
    .rk-grupo { margin: 10px 0 6px; font-size: 0.8rem; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .rk-grupo:first-of-type { margin-top: 0; }
    .rk-juegos { display: flex; flex-wrap: wrap; gap: 6px; }
    .rk-juegos button {
      border: 2px solid var(--glass-border); background: rgba(0, 0, 0, 0.25); color: var(--ink);
      font: 900 0.95rem var(--font-body); border-radius: 999px; padding: 6px 12px; min-height: 44px; cursor: pointer;
    }
    .rk-juegos button.on { border-color: var(--cyan); background: rgba(46, 230, 214, 0.18); }
    .rk-perfil ul { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 4px; }
    .rk-perfil li { display: flex; justify-content: space-between; gap: 8px; }
    details.rk-perfil summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; }
  </style>
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Juegos de Salón">
  <script type="module">import '../assets/js/instalable.js';</script>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <a class="back" href="../" id="btn-menu">‹ Menú</a>
      <div class="tools"><div id="lang-slot"></div><span id="sound-slot"></span></div>
    </div>
    <header class="intro-hero center">
      <span class="rk-hero-icon" aria-hidden="true">🏅</span>
      <h1 class="display display--lg rainbow" id="rk-h1">Rankings</h1>
      <p class="sub muted" id="rk-sub"></p>
    </header>
    <div class="rk-pagina" id="rk-pagina"></div>
  </main>

  <script type="module">
    import { el, conEmoji } from '../assets/js/ui.js';
    import '../assets/js/season.js'; // the seasonal touches (D-457)
    import { getLang, langToggle, applyStatic, pickLang, COMMON } from '../assets/js/i18n.js';
    import { SFX, soundToggle, initSound } from '../assets/js/sound.js';
    import { SUELTOS, GAMES, gameById } from '../assets/js/games.js';
    import { DECKS } from '../timeline/decks/index.js';
    import { LOCALES as LINEA } from '../timeline/rules.js';
    import { trackVisit } from '../assets/js/transport/stats.js';
    import { bloqueJugador, bloqueRanking, bloqueCampeones } from '../assets/js/ranking.js';
    import { jugador, leerYo } from '../assets/js/jugador.js';
    import { TODOTERRENO, PARTIDAS, UAD_PUNTOS } from '../assets/js/records.js';
    import { VARIANTES } from '../cup/engine.js';
    import { juegosCopa } from '../cup/rules.js';

    trackVisit(); // el tráfico del sitio (D-208)
    initSound();
    const lang = getLang();
    document.documentElement.lang = lang;
    const C = COMMON[lang] || COMMON.es, T = C.rk;
    applyStatic(C);
    document.title = `${T.pageTitle} 🏅 · ${C.appTitle}`;
    document.getElementById('rk-h1').textContent = T.pageTitle;
    document.getElementById('rk-sub').textContent = T.pageSub;
    document.getElementById('btn-menu').textContent = `‹ ${C.menu}`;
    document.getElementById('lang-slot').append(langToggle());
    document.getElementById('sound-slot').append(soundToggle());
    const fmt = (s, v = {}) => String(s).replace(/\{(\w+)\}/g, (_, k) => (v[k] !== undefined ? v[k] : `{${k}}`));
    const tap = () => SFX.tap();

    const juegos = SUELTOS.filter(g => !g.labs);
    const pagina = document.getElementById('rk-pagina');

    /* Tus partidas: cuántas veces jugó cada cosa (solo con jugador). Cambiar el PIN va en "Juegas como". */
    const perfil = el('div', {});
    async function dibujarPerfil() {
      perfil.replaceChildren();
      if (!leerYo()) return;
      try {
        const p = await (await jugador()).perfil();
        const filas = Object.entries(p?.juegos || {}).sort((a, b2) => b2[1].n - a[1].n);
        if (!filas.length) return;
        const lista = el('ul', {});
        for (const [id, x] of filas) {
          const g = juegos.find(j => j.id === id) || gameById(id);
          lista.append(el('li', {}, el('span', {}, g ? conEmoji(g.emoji, pickLang(g.name, lang)) : id), el('b', {}, x.n === 1 ? T.playsOne : fmt(T.plays, { n: x.n }))));
        }
        // Folded with the total in its title, so the rankings show first (#783)
        const total = filas.reduce((s, [, x]) => s + x.n, 0);
        perfil.replaceChildren(el('details', { class: 'panel rk-perfil' },
          el('summary', { class: 'lead rk-titulo' }, `👤 ${T.myPlays} · ${total === 1 ? T.playsOne : fmt(T.plays, { n: total })}`), lista));
      } catch (_) { /* sin red: no hay qué mostrar */ }
    }
    dibujarPerfil();
    jugador().then(J => J.escuchar(dibujarPerfil)).catch(() => {});

    /*
     * La página (D-219): arriba lo que vale para todos los juegos —el Ranking general y las
     * partidas jugadas—; abajo, un filtro grande entre Juegos y Copas. La elección queda en la
     * dirección (#juegos/reinas, #copas), así un link lleva a la tabla que se quiere mostrar.
     */
    const marcarFichas = (caja, id) => caja.querySelectorAll('button').forEach(b => { const on = b.dataset.id === id; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    const ficha = (o, alElegir) => el('button', { type: 'button', 'data-id': o.id, onClick: () => { tap(); alElegir(o.id); } }, conEmoji(o.emoji, o.nombre));

    // Juegos de a uno: los sueltos (récord de 0 a 100), Toque y Fama solo y Línea Relámpago por temática
    const relampago = (LINEA[lang] || LINEA.es).soloTitle.replace(/^\S+\s+/, '');
    // Los juegos de grupo que también se juegan solos, con su tabla `<id>_solo` (Ahorcado desde D-274)
    const conSolo = ['toque-y-fama', 'ahorcado', 'generala'].map(gameById).filter(g => g?.available);
    const deUno = [
      // A game with variants has one table per variant (D-331): the default one is the game's, the others `<id>_<variant>`
      ...juegos.flatMap(g => {
        const conV = v => `${pickLang(g.name, lang)} · ${juegosCopa(lang)[g.id]?.variantes?.[v]?.nombre || v}`;
        const vs = VARIANTES[g.id] || [];
        return [{ id: g.id, emoji: g.emoji, nombre: vs.length ? conV(vs[0]) : pickLang(g.name, lang) },
          ...vs.slice(1).map(v => ({ id: `${g.id}_${v}`, emoji: g.emoji, nombre: conV(v) }))];
      }),
      ...conSolo.map(g => ({ id: `${g.id}_solo`, emoji: g.emoji, nombre: pickLang(g.name, lang) })),
      // Línea Relámpago es una ficha; sus temáticas se eligen adentro (una tabla por temática)
      ...(DECKS.length ? [{ id: 'linea-de-tiempo_rel', emoji: '⏳', nombre: relampago, temas: true }] : []),
    ];
    // Juegos de grupo: sus victorias. Salen del registro: los que se juegan con sala (C-16)
    const enGrupo = GAMES.filter(g => g.available && g.jugadas)
      .map(g => ({ id: `${g.id}_victorias`, emoji: g.emoji, nombre: pickLang(g.name, lang), victorias: true }));
    const todasJuegos = [...deUno, ...enGrupo];

    const ranuraJuego = el('div', { class: 'rk-seccion' }); // las temáticas de Relámpago y su tabla, con aire entre los dos paneles
    let juegoElegido = null;
    const elegirJuego = id => {
      // Una temática de Relámpago (linea-de-tiempo_rel-historia) se muestra dentro de su ficha
      const tema = String(id || '').startsWith('linea-de-tiempo_rel-') ? id.slice('linea-de-tiempo_rel-'.length) : null;
      const o = todasJuegos.find(x => x.id === (tema ? 'linea-de-tiempo_rel' : id)) || todasJuegos[0];
      marcarFichas(fichasJuegos, o.id);
      if (o.temas) {
        const deck = DECKS.find(d => d.id === tema) || DECKS[0];
        juegoElegido = `linea-de-tiempo_rel-${deck.id}`;
        const temas = el('div', { class: 'rk-juegos', role: 'group', 'aria-label': relampago },
          DECKS.map(d => ficha({ id: `linea-de-tiempo_rel-${d.id}`, emoji: d.emoji, nombre: d.name[lang] }, elegirJuego)));
        marcarFichas(temas, juegoElegido);
        ranuraJuego.replaceChildren(el('div', { class: 'panel' }, temas), bloqueRanking({
          juego: juegoElegido, titulo: conEmoji(deck.emoji, fmt(T.titleOf, { game: `${relampago}: ${deck.name[lang]}` })), alTocar: tap,
        }));
      } else {
        juegoElegido = o.id;
        ranuraJuego.replaceChildren(bloqueRanking({
          juego: o.id, titulo: conEmoji(o.emoji, fmt(o.victorias ? T.winsOf : T.titleOf, { game: o.nombre })),
          hint: o.victorias ? T.winsHint : null, alTocar: tap,
        }));
      }
      if (seccion === 'juegos') history.replaceState(null, '', `#juegos/${juegoElegido}`);
    };
    const fichasJuegos = el('div', {},
      el('p', { class: 'rk-grupo' }, T.groupOne), el('div', { class: 'rk-juegos', role: 'group', 'aria-label': T.groupOne }, deUno.map(o => ficha(o, elegirJuego))),
      el('p', { class: 'rk-grupo' }, T.groupMany), el('div', { class: 'rk-juegos', role: 'group', 'aria-label': T.groupMany }, enGrupo.map(o => ficha(o, elegirJuego))));
    const seccionJuegos = el('div', { class: 'rk-seccion', id: 'rk-juegos' },
      el('div', { class: 'panel' }, el('p', { class: 'lead rk-titulo' }, T.gamePick), fichasJuegos),
      ranuraJuego);

    // Copas: los campeones y el mejor día de copa de cada uno, juego por juego
    const ranuraDia = el('div', {});
    const elegirDia = id => {
      const o = deUno.find(x => x.id === id) || deUno[0];
      marcarFichas(fichasDia, o.id);
      ranuraDia.replaceChildren(bloqueRanking({ juego: `${o.id}_copa`, titulo: conEmoji(o.emoji, `${T.cupBestDay}: ${o.nombre}`), pestanas: ['siempre', 'amigos'], alTocar: tap }));
    };
    const deCopa = deUno.filter(o => juegos.some(g => g.id === o.id));
    // (la ficha de Relámpago no tiene copa: sus temáticas no son juegos de La Copa)
    const fichasDia = el('div', { class: 'rk-juegos', role: 'group', 'aria-label': T.cupBestDay }, deCopa.map(o => ficha(o, elegirDia)));
    const seccionCopas = el('div', { class: 'rk-seccion', id: 'rk-copas' },
      bloqueCampeones({ max: 20, enlace: false, ultimas: 10 }),
      el('div', { class: 'panel' }, el('p', { class: 'lead rk-titulo' }, `📅 ${T.cupBestDay}`), el('p', { class: 'muted rk-hint' }, T.cupBestDayHint), fichasDia),
      ranuraDia);
    if (deCopa.length) elegirDia(deCopa[0].id);

    // El filtro grande: Juegos o Copas
    let seccion = 'juegos';
    const macro = el('div', { class: 'rk-macro', role: 'tablist' },
      [['juegos', T.tabGames], ['copas', T.tabCups]].map(([id, rotulo]) => el('button', {
        type: 'button', role: 'tab', 'data-id': id, onClick: () => { tap(); mostrar(id); },
      }, rotulo)));
    function mostrar(id) {
      seccion = id === 'copas' ? 'copas' : 'juegos';
      macro.querySelectorAll('button').forEach(b => { const on = b.dataset.id === seccion; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
      seccionJuegos.hidden = seccion !== 'juegos';
      seccionCopas.hidden = seccion !== 'copas';
      history.replaceState(null, '', seccion === 'copas' ? '#copas' : `#juegos/${juegoElegido || ''}`);
    }

    // Uno al día points (D-412, D-414): the same table as on /today/
    const puntosDia = bloqueRanking({ juego: UAD_PUNTOS, titulo: `📅 ${T.dailyPoints}`, hint: T.dailyPointsHint, pestanas: ['mes', 'amigosMes'], alTocar: tap });
    pagina.append(
      bloqueJugador({ alTocar: tap }),
      perfil,
      bloqueRanking({ juego: TODOTERRENO, titulo: `🏅 ${T.general}`, hint: T.allRounderHint, alTocar: tap }),
      bloqueRanking({ juego: PARTIDAS, titulo: `🎲 ${T.playsTitle}`, hint: T.playsHint, alTocar: tap }),
      puntosDia,
      macro,
      seccionJuegos,
      seccionCopas,
    );
    // Lo que pide la dirección: #copas (también el #copa de antes), #juegos/<tabla> o, de antes, #<juego>
    const pedido = decodeURIComponent(location.hash.slice(1));
    const tablaPedida = pedido.startsWith('juegos/') ? pedido.slice(7) : pedido;
    elegirJuego(todasJuegos.some(o => o.id === tablaPedida) || tablaPedida.startsWith('linea-de-tiempo_rel-') ? tablaPedida : todasJuegos[0]?.id);
    mostrar(/^copas?$/.test(pedido) ? 'copas' : 'juegos');
    window.__records = { get seccion() { return seccion; }, get juego() { return juegoElegido; } };
  </script>
  <!-- The site's footer, with the funny line, under the rankings -->
  <script type="module">import('../assets/js/site-footer.js').then(m => m.mountFooter(document.querySelector('main.app'), { phrase: true, screen: 'rankings' }));</script>
</body>
</html>
